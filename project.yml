name: DJMT1Driver
options:
  bundleIdPrefix: de.cypher
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: DBCZNZ63SD
    CODE_SIGN_STYLE: Automatic
    # Bei gleicher Version ersetzt macOS eine bereits installierte Extension
    # nicht -- jede neue Fassung braucht eine hoehere Nummer.
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "8"
  configs:
    # Ein mit "Apple Development" signierter Dext laedt nur im Developer-Modus
    # (auf Apple Silicon nur mit SIP-Aenderung). Release wird darum mit
    # Developer ID signiert und notarisiert -- so laedt er auf jedem Mac.
    Release:
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Ohne Hardened Runtime lehnt die Notarisierung die App ab.
      ENABLE_HARDENED_RUNTIME: YES
schemes:
  DJMT1Installer:
    build:
      targets:
        DJMT1Installer: all
    archive:
      config: Release
targets:
  DJMT1Installer:
    type: application
    platform: macOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cypher.djmt1
        CODE_SIGN_ENTITLEMENTS: App/DJMT1Installer.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - target: DJMT1AudioDriver
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/SystemExtensions
  DJMT1AudioDriver:
    type: driver-extension
    platform: macOS
    sources:
      - path: Driver
        buildPhase: sources
        includes:
          - "*.iig"
          - "*.cpp"
    info:
      path: Driver/Info.plist
      properties:
        CFBundleName: DJM-T1 Audio
        # Ohne diesen Schluessel findet OSSystemExtensionManager das Bundle
        # nicht: "Unable to find any matched extension with identifier".
        CFBundlePackageType: DEXT
        # Explizit, weil xcodegen sonst 1.0/1 festschreibt und macOS eine
        # gleich nummerierte Extension nicht ersetzt.
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "8"
        OSBundleUsageDescription: "Audio driver for the Pioneer DJM-T1 and Rane SL2"
        IOKitPersonalities:
          DJMT1AudioDriver:
            CFBundleIdentifier: de.cypher.djmt1.audio
            CFBundleIdentifierKernel: com.apple.kpi.iokit
            IOClass: IOUserService
            IOUserClass: DJMT1Driver
            IOUserServerName: de.cypher.djmt1.audio
            IOProviderClass: IOUSBHostInterface
            IOMatchCategory: de.cypher.djmt1.audio
            idVendor: 2276
            idProduct: 350
            bConfigurationValue: 1
            bInterfaceNumber: 0
            IOUserAudioDriverUserClientProperties:
              IOClass: IOUserUserClient
              IOUserClass: IOUserAudioDriverUserClient
          RaneSL2Audio:
            CFBundleIdentifier: de.cypher.djmt1.audio
            CFBundleIdentifierKernel: com.apple.kpi.iokit
            IOClass: IOUserService
            IOUserClass: DJMT1Driver
            IOUserServerName: de.cypher.djmt1.audio
            IOProviderClass: IOUSBHostInterface
            IOMatchCategory: de.cypher.djmt1.audio
            idVendor: 7365
            idProduct: 19
            bConfigurationValue: 1
            bInterfaceNumber: 1
            IOUserAudioDriverUserClientProperties:
              IOClass: IOUserUserClient
              IOUserClass: IOUserAudioDriverUserClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.cypher.djmt1.audio
        # Das Bundle muss wie seine Bundle-ID heissen, sonst findet
        # OSSystemExtensionManager es nicht (Fehler 4, extensionNotFound).
        PRODUCT_NAME: de.cypher.djmt1.audio
        CODE_SIGN_ENTITLEMENTS: Driver/DJMT1AudioDriver.entitlements
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        SDKROOT: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "23.0"
        OTHER_LDFLAGS: ["-framework", "DriverKit", "-framework", "USBDriverKit", "-framework", "AudioDriverKit"]
